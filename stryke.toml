[package]
name = "polars"
version = "0.1.0"
description = "Polars-backed pandas + numpy surface for stryke. Hand-rolled df_*/sr_*/arr_*/np_*/linalg_*/rand_*/fft_* builtins on top of polars + ndarray, dlopened in-process via stryke's FFI bridge — no helper-binary fork, no NDJSON pipe."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-polars"
edition = "2026"

[ffi]
lib-name = "stryke_polars"
namespace = "Polars"
exports = [
    "polars__version",
    "polars__df_new",
    "polars__df_head",
    "polars__df_tail",
    "polars__df_shape",
    "polars__df_columns",
    "polars__df_dtypes",
    "polars__df_select",
    "polars__df_to_json",
    "polars__df_drop",
    "polars__df_rename",
    "polars__df_sort",
    "polars__df_filter_gt",
    "polars__df_filter_lt",
    "polars__df_filter_eq",
    "polars__df_sum",
    "polars__df_mean",
    "polars__df_median",
    "polars__df_min",
    "polars__df_max",
    "polars__df_std",
    "polars__df_var",
    "polars__df_count",
    "polars__df_quantile",
    "polars__df_nunique",
    "polars__df_cumsum",
    "polars__df_cumprod",
    "polars__df_cummin",
    "polars__df_cummax",
    "polars__df_abs",
    "polars__df_sqrt",
    "polars__df_exp",
    "polars__df_log",
    "polars__df_floor",
    "polars__df_ceil",
    "polars__df_round",
    "polars__df_fill_null",
    "polars__df_drop_nulls",
    "polars__df_is_null",
    "polars__df_is_not_null",
    "polars__df_unique",
    "polars__df_value_counts",
    "polars__df_inner_join",
    "polars__df_left_join",
    "polars__df_full_join",
    "polars__df_cross_join",
    "polars__df_semi_join",
    "polars__df_anti_join",
    "polars__df_concat",
    "polars__df_shift",
    "polars__df_diff",
    "polars__df_pct_change",
    "polars__df_rank",
    "polars__df_clip",
    "polars__df_groupby_sum",
    "polars__df_groupby_mean",
    "polars__df_groupby_median",
    "polars__df_groupby_min",
    "polars__df_groupby_max",
    "polars__df_groupby_std",
    "polars__df_groupby_var",
    "polars__df_groupby_count",
    "polars__df_rolling_sum",
    "polars__df_rolling_mean",
    "polars__df_rolling_min",
    "polars__df_rolling_max",
    "polars__df_rolling_std",
    "polars__df_rolling_var",
    "polars__df_ewm_mean",
    "polars__df_transpose",
    "polars__df_to_csv",
    "polars__df_to_ndjson",
    "polars__df_pearson_corr",
    "polars__df_filter_is_in",
    "polars__df_nlargest",
    "polars__df_nsmallest",
    "polars__df_sample",
    "polars__df_replace_value",
    "polars__arr_zeros",
    "polars__arr_ones",
    "polars__arr_arange",
    "polars__arr_linspace",
    "polars__arr_reshape",
    "polars__arr_transpose",
    "polars__arr_sum",
    "polars__arr_mean",
    "polars__arr_min",
    "polars__arr_max",
    "polars__arr_dot",
    "polars__arr_concatenate",
    "polars__np_sin",
    "polars__np_cos",
    "polars__np_tan",
    "polars__np_exp",
    "polars__np_log",
    "polars__np_sqrt",
    "polars__np_abs",
    "polars__np_add",
    "polars__np_subtract",
    "polars__np_multiply",
    "polars__np_divide",
    "polars__linalg_inv",
    "polars__linalg_det",
    "polars__linalg_solve",
    "polars__linalg_norm",
    "polars__rand_normal",
    "polars__rand_uniform",
    "polars__fft_fft",
    "polars__fft_ifft",
]

[scripts]
build = "cargo build --release"
build-debug = "cargo build"
clean = "cargo clean"
test = "s test t/"
install = "s pkg install -g ."
